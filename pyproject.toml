[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-drop"
version = "2.0.0"
description = "Terminal-first local file sharing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "textual>=0.80,<2",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7", "qrcode[pil]>=7.4,<9"]

[project.scripts]
devdrop = "app.cli:main"

[tool.setuptools]
packages = ["app"]
